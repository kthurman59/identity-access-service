services:
  postgres:
    image: postgres:16-alpine
    container_name: ias-postgres-1
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d iam"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ias_iam_pgdata:/var/lib/postgresql/data

  ias:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ias-ias
    container_name: ias-ias-1
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/iam
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    env_file:
      - ./.env

volumes:
  ias_iam_pgdata:
    name: ias_ias_iam_pgdata

networks:
  default:
    name: ias_default

