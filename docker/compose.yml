services:
  postgres:
    image: postgres:16-alpine
    container_name: ias-postgres-1
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ias_iam_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  ias:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ias-ias
    container_name: ias-ias-1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      IAS_JWT_SECRET_B64: ${IAS_JWT_SECRET_B64}
      IAS_JWT_ISSUER: ${IAS_JWT_ISSUER:-iamauth}
      IAS_JWT_ACCESS_TTL_MINUTES: ${IAS_JWT_ACCESS_TTL_MINUTES:-15}
      IAS_REFRESH_TTL: ${IAS_REFRESH_TTL:-30d}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
    ports:
      - "8082:8082"
    restart: unless-stopped

volumes:
  ias_iam_pgdata:

